name: Publicar APK Opus Magnum
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-opus-magnum.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: release-android-v2.0.0
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publicar o APK original da versão 2.0.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh run download 42530770480 --name Legio-Latina-Opus-Magnum
          echo '2024dec30126d5abef3e1cc2d7e8787516316fd40c17ee5f81768b4133b05718  Legio-Latina-Opus-Magnum.apk' | sha256sum --check
          gh release create v2.0.0 'Legio-Latina-Opus-Magnum.apk#Baixar APK para Android' \
            --target 3073cf3b750d09354be4c39a4f9ed59a06c1712a --title 'Legio Latina · Opus Magnum 2.0.0' \
            --notes 'APK da versão Opus Magnum para Android 8 ou posterior. Inclui a campanha de 36 lições e o leitor de Sêneca com análise palavra por palavra.'
