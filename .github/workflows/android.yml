name: Gerar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/legio-sdk"
          mkdir -p "$sdk/platforms" "$sdk/build-tools"
          cd "$sdk"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/platform-35_r02.zip -o platform.zip
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/build-tools_r35_linux.zip -o build-tools.zip
          sha256sum --check <<'CHECKSUMS'
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  platform.zip
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  build-tools.zip
          CHECKSUMS
          unzip -q platform.zip -d platforms
          unzip -q build-tools.zip -d build-tools
          mv build-tools/android-15 build-tools/35.0.0
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Legio-Latina-Opus-Magnum
          path: android/out/Legio-Latina-Opus-Magnum.apk
          if-no-files-found: error
